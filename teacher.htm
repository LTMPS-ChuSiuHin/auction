<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4E 課堂積分拍賣會 - 老師控制台 (防重複登入 + 視覺特效版)</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --gold: #f59e0b;
            --bg-dark: #090d16;
            --card-bg: rgba(15, 23, 42, 0.78);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; }

        body {
            background: linear-gradient(-45deg, #090d16, #1e1b4b, #311042, #0f172a);
            background-size: 400% 400%;
            animation: auroraBG 18s ease infinite;
            color: #f8fafc;
            min-height: 100vh;
            padding: 18px;
            overflow-x: hidden;
        }

        @keyframes auroraBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            padding: 14px 24px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            margin-bottom: 20px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .header h1 {
            font-size: 1.75rem;
            background: linear-gradient(to right, #fef08a, #f59e0b, #fb7185, #38bdf8);
            background-size: 200% auto;
            animation: shineText 4s linear infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        .db-controls { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            padding: 9px 16px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-size: 0.92rem;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
        .btn:active:not(:disabled) { transform: scale(0.95); }

        .btn-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 4px 15px rgba(5, 150, 105, 0.4); }
        .btn-gold { background: linear-gradient(135deg, #f59e0b, #b45309); color: #fff; box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45); }
        .btn-red { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4); }
        .btn-gray { background: rgba(71, 85, 105, 0.85); border: 1px solid rgba(255,255,255,0.15); }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; border-radius: 8px; }
        .btn-xs { padding: 3px 8px; font-size: 0.72rem; border-radius: 6px; }

        /* 三欄式佈局 */
        .main-grid {
            display: grid;
            grid-template-columns: 340px 1.2fr 1.1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1320px) {
            .main-grid { grid-template-columns: 1fr 1fr; }
            .students-panel { grid-column: 1 / -1; }
        }
        @media (max-width: 820px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .stage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 左側：獎品清單管理 */
        .add-prize-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(15, 23, 42, 0.65);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .add-prize-row { display: flex; gap: 8px; }
        .add-prize-form input {
            background: #1e293b;
            border: 1px solid #475569;
            color: white;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .add-prize-form input:focus { border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .add-prize-form input[type="text"] { flex: 1; min-width: 0; }
        .add-prize-form input[type="number"] { width: 82px; }

        .prize-list-container {
            flex: 1;
            max-height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .prize-item {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            transition: all 0.25s;
        }
        .prize-item.active-prize {
            border: 2px solid #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(180, 83, 9, 0.15));
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        .prize-item.rolling-highlight {
            border: 2px solid #38bdf8;
            background: rgba(56, 189, 248, 0.3);
            transform: scale(1.03);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
        }
        .prize-item.sold-prize {
            opacity: 0.52;
            background: rgba(15, 23, 42, 0.45);
            border-style: dashed;
        }
        .prize-item-info { flex: 1; min-width: 0; }
        .prize-item-title {
            font-weight: 900;
            font-size: 0.98rem;
            color: #f8fafc;
            word-break: break-word;
        }
        .prize-item.sold-prize .prize-item-title {
            text-decoration: line-through;
            color: #94a3b8;
        }
        .prize-item-meta {
            font-size: 0.8rem;
            color: #fde047;
            margin-top: 3px;
            font-weight: bold;
        }
        .prize-item.sold-prize .prize-item-meta { color: #34d399; }
        .prize-item-actions { display: flex; gap: 5px; flex-shrink: 0; }

        /* 中間：拍賣主舞台 */
        .status-badge {
            padding: 6px 14px;
            border-radius: 99px;
            font-weight: 900;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .status-idle { background: #334155; color: #cbd5e1; }
        .status-bidding { background: #059669; color: #ecfdf5; box-shadow: 0 0 20px #10b981; animation: pulse 1.5s infinite; }
        .status-test { background: #7c3aed; color: #f3e8ff; box-shadow: 0 0 20px #8b5cf6; }
        .status-sold { background: #d97706; color: #fef3c7; box-shadow: 0 0 20px #f59e0b; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }

        .auction-display {
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.95), rgba(9, 13, 22, 0.98));
            border: 2px solid rgba(245, 158, 11, 0.45);
            border-radius: 22px;
            padding: 28px 18px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 18px;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .auction-display.bid-flash {
            animation: stageFlash 0.6s ease-out;
        }
        @keyframes stageFlash {
            0% { box-shadow: 0 0 0 0 rgba(253, 224, 71, 0.8), inset 0 0 40px rgba(253, 224, 71, 0.4); border-color: #fef08a; transform: scale(1.02); }
            100% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.45); transform: scale(1); }
        }

        .prize-title {
            font-size: 1.65rem;
            color: #fff;
            font-weight: 900;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .base-price-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 3px 14px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .current-price {
            font-size: 5rem;
            font-weight: 900;
            color: #fde047;
            text-shadow: 0 0 35px rgba(253, 224, 71, 0.55);
            line-height: 1.1;
            margin: 8px 0;
            transition: transform 0.2s;
        }
        .current-price.pop { animation: pricePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes pricePop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.18); color: #fff; }
            100% { transform: scale(1); }
        }
        .current-price span { font-size: 1.6rem; color: #f59e0b; }

        .highest-bidder {
            font-size: 1.55rem;
            font-weight: 900;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .cooldown-banner {
            margin-top: 16px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.25);
            border: 1px solid #ef4444;
            color: #fca5a5;
            font-size: 1.2rem;
            font-weight: 900;
            display: none;
        }
        .cooldown-banner.active { display: block; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .flow-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .flow-controls .btn { padding: 14px; font-size: 1.02rem; }

        .bid-history {
            margin-top: 16px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            padding: 12px;
            max-height: 155px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .bid-history h4 { font-size: 0.88rem; color: #94a3b8; margin-bottom: 6px; }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.92rem;
            animation: slideIn 0.25s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

        /* 右側學生積分與登入狀態榜 */
        .online-summary {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .online-pill {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .students-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(122px, 1fr));
            gap: 9px;
            max-height: 620px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .stu-chip {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 9px 7px;
            text-align: center;
            transition: all 0.25s;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stu-chip.is-online {
            border-color: rgba(52, 211, 153, 0.5);
            background: linear-gradient(160deg, rgba(16, 185, 129, 0.12), rgba(15, 23, 42, 0.85));
        }
        .stu-chip.leader {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.35), rgba(217, 119, 6, 0.25));
            border: 2px solid #f59e0b;
            transform: scale(1.03);
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
        }

        .stu-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            margin-bottom: 2px;
        }
        .stu-chip .id { color: #94a3b8; font-weight: bold; }
        .login-tag {
            padding: 1px 6px;
            border-radius: 99px;
            font-weight: 800;
            font-size: 0.68rem;
        }
        .login-tag.on { background: rgba(16, 185, 129, 0.25); color: #6ee7b7; }
        .login-tag.off { background: rgba(100, 116, 139, 0.25); color: #94a3b8; }

        .stu-chip .name { font-size: 1.02rem; font-weight: 900; margin: 2px 0; color: #f8fafc; }
        .stu-chip .pts { font-size: 1.02rem; font-weight: 900; color: #34d399; }
        .stu-chip .spent { font-size: 0.74rem; color: #fbbf24; margin-top: 1px; font-weight: bold; }

        .kick-btn {
            margin-top: 6px;
            width: 100%;
            background: rgba(239, 68, 68, 0.22);
            border: 1px solid rgba(239, 68, 68, 0.55);
            color: #fca5a5;
            border-radius: 8px;
            padding: 4px 4px;
            font-size: 0.74rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .kick-btn:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>🔨 4E 課堂積分拍賣會（老師端）</h1>
            <div id="conn-status" style="font-size: 0.85rem; color: #94a3b8; margin-top: 4px;">📡 正在連線至 Realtime Database (Asia-Southeast1)...</div>
        </div>
        <div class="db-controls">
            <button class="btn btn-blue" onclick="loadFromFirestore()">📥 從 Firestore 載入分數</button>
            <button class="btn btn-green" onclick="saveToFirestore()">📤 將分數儲存回 Firestore</button>
        </div>
    </div>

    <div class="main-grid">
        <!-- 左側：預先設定獎品庫 -->
        <div class="panel">
            <div class="stage-header">
                <h2 style="font-size: 1.2rem;">🎁 拍賣獎品庫</h2>
                <button class="btn btn-purple btn-sm" id="btn-random-prize" onclick="randomSelectPrize()">🎲 隨機抽取獎品</button>
            </div>

            <div class="add-prize-form">
                <div class="add-prize-row">
                    <input type="text" id="new-prize-name" placeholder="獎品名稱 (如: 免功課券)">
                    <input type="number" id="new-prize-base" placeholder="底價" value="5" min="0">
                </div>
                <div class="add-prize-row">
                    <button class="btn btn-gold" style="flex: 1;" onclick="addPrizeToCatalog()">➕ 新增獎品至清單</button>
                    <button class="btn btn-gray btn-sm" onclick="addSamplePrizes()" title="快速加入示範獎品">✨ 範例</button>
                </div>
            </div>

            <div class="prize-list-container" id="prize-catalog-list">
                <div style="text-align:center; color:#64748b; padding: 20px;">尚未新增獎品</div>
            </div>
        </div>

        <!-- 中間：拍賣控制中心 -->
        <div class="panel">
            <div class="stage-header">
                <h2 style="font-size: 1.25rem;">🎪 拍賣舞台控制</h2>
                <span id="status-badge" class="status-badge status-idle">⏸ 未開始第一輪拍賣</span>
            </div>

            <!-- 拍賣大螢幕 -->
            <div class="auction-display" id="auction-stage-box">
                <div class="prize-title" id="display-prize-name">請從左側選擇或隨機抽取獎品</div>
                <div class="base-price-tag" id="display-base-price">底價：0 分</div>
                <div class="current-price" id="display-price">0 <span>分</span></div>
                <div class="highest-bidder" id="display-bidder">尚無人出價</div>

                <div class="cooldown-banner" id="cooldown-banner">
                    ⏳ 冷靜倒數中：<span id="cooldown-sec">3.0</span> 秒（暫停出價）
                </div>
            </div>

            <!-- 流程按鈕 -->
            <div class="flow-controls">
                <button class="btn btn-green" id="btn-start-real" onclick="startAuction(false)">🚀 開始正式拍賣</button>
                <button class="btn btn-purple" id="btn-start-test" onclick="startAuction(true)">🧪 開始測試拍賣 (不扣分)</button>
                <button class="btn btn-gold" id="btn-deal" onclick="finalizeDeal()" disabled>🔨 成交並扣除中標者分數</button>
                <button class="btn btn-red" id="btn-cancel" onclick="resetCurrentRound()">🔄 重置本輪 / 流拍</button>
            </div>

            <!-- 即時出價紀錄 -->
            <div class="bid-history">
                <h4>📜 本輪出價紀錄 (最新在最上)</h4>
                <div id="history-list">
                    <div style="color: #64748b; font-size: 0.9rem;">暫無出價紀錄</div>
                </div>
            </div>
        </div>

        <!-- 右側：Realtime Database 學生即時積分與登入狀態 -->
        <div class="panel students-panel">
            <div class="stage-header">
                <h2 style="font-size: 1.18rem;">👥 學生即時積分與登入狀況</h2>
                <div class="online-summary">
                    <span class="online-pill" id="online-count-badge">在線：0 / 32</span>
                    <button class="btn btn-red btn-xs" onclick="forceLogoutAll()" title="讓所有學生退回選擇學號畫面">⏏ 全員登出</button>
                </div>
            </div>
            <div class="students-list" id="students-grid"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Firebase 初始化 (指定 Asia-Southeast1 RTDB)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBr0-oNmRN859g6bfGDVjSdA1brJC8CxNs",
            authDomain: "ltmps-c92a0.firebaseapp.com",
            databaseURL: "https://ltmps-c92a0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ltmps-c92a0",
            storageBucket: "ltmps-c92a0.firebasestorage.app",
            messagingSenderId: "716255242034",
            appId: "1:716255242034:web:b25a037869d8a9de6f992b"
        };

        firebase.initializeApp(firebaseConfig);
        const firestore = firebase.firestore();
        const rtdb = firebase.database();

        const fsScoresRef = firestore.collection('ClassManagement').doc('Class4E_Scores');
        const fsAuctionSummaryRef = firestore.collection('ClassManagement').doc('Class4E_AuctionSummary');
        const fsBackupRef = firestore.collection('ClassManagement_4E_Backups');

        const stateRef = rtdb.ref('Auction4E/state');
        const studentsRef = rtdb.ref('Auction4E/students');
        const sessionsRef = rtdb.ref('Auction4E/sessions');
        const prizesRef = rtdb.ref('Auction4E/prizes');
        const historyRef = rtdb.ref('Auction4E/history');

        const rawStudents = [
            "陳卓謙", "陳賀楠", "陳子正", "陳奕謙", "陳禹衡",
            "鄭斯豪", "招卓康", "莊榳昊", "丁安妮", "馮溢匡",
            "郭慧瑤", "許悅", "關海泠", "關海瑤", "郭思翹",
            "黎晞彤", "李海琳", "梁靖童", "梁頌朗", "梁僖悅",
            "梁梓童", "李詠晴", "文樂兒", "吳梓謙", "吳泳汶",
            "彭瀚程", "譚健希", "譚文昊", "曾立言", "謝思睿",
            "黃芊林", "俞逸澧"
        ];

        let localStudents = {};
        let localSessions = {};
        let localPrizes = {};
        let currentState = null;
        let serverTimeOffset = 0;
        let isRollingPrize = false;

        rtdb.ref('.info/serverTimeOffset').on('value', (snap) => {
            serverTimeOffset = snap.val() || 0;
        });

        rtdb.ref('.info/connected').on('value', (snap) => {
            const el = document.getElementById('conn-status');
            if (snap.val() === true) {
                el.innerHTML = '🟢 已連線至 Realtime Database（即時同步中）';
                el.style.color = '#34d399';
            } else {
                el.innerHTML = '🔴 資料庫連線中斷...';
                el.style.color = '#f87171';
            }
        });

        // ==========================================
        // 2. Firestore <-> Realtime Database 資料同步
        // ==========================================
        async function loadFromFirestore() {
            if (!confirm('確定要從 Firestore 載入最新分數到拍賣系統嗎？\n（將重設學生已用分數為 0，並初始化未開始狀態）')) return;

            try {
                const doc = await fsScoresRef.get();
                if (!doc.exists) {
                    alert('❌ 找不到 Firestore 分數資料！');
                    return;
                }
                const fsData = doc.data();
                const rtdbStudents = {};

                rawStudents.forEach((name, idx) => {
                    const id = idx + 1;
                    const initialScore = fsData[id] || 0;
                    rtdbStudents[id] = {
                        id: id,
                        name: name,
                        initialScore: initialScore,
                        score: initialScore,
                        spent: 0
                    };
                });

                await studentsRef.set(rtdbStudents);
                await historyRef.remove();
                await stateRef.set({
                    status: 'IDLE',
                    isTest: false,
                    prizeId: null,
                    prizeName: '請選擇或隨機抽取獎品',
                    basePrice: 0,
                    currentPrice: 0,
                    highestBidderId: null,
                    highestBidderName: '尚無人出價',
                    cooldownUntil: 0
                });

                alert('✅ 已成功從 Firestore 載入全班分數！目前為「未開始第一輪拍賣」狀態。');
            } catch (err) {
                console.error(err);
                alert('❌ 載入失敗：' + err.message);
            }
        }

        async function saveToFirestore() {
            if (Object.keys(localStudents).length === 0) {
                alert('⚠️ 目前 Realtime Database 沒有學生分數資料可儲存！');
                return;
            }
            if (!confirm('確定要將拍賣後的「剩餘分數」與「已使用分數紀錄」儲存回 Firestore 嗎？\n（系統會自動先在 Firestore 建立一筆備份）')) return;

            try {
                const oldDoc = await fsScoresRef.get();
                if (oldDoc.exists) {
                    const now = new Date();
                    await fsBackupRef.add({
                        timestamp: now.getTime(),
                        dateStr: now.toLocaleString('zh-HK') + ' (拍賣會寫回前自動備份)',
                        scores: oldDoc.data()
                    });
                }

                const updatedScores = {};
                const auctionSummary = {
                    updatedAt: new Date().toLocaleString('zh-HK'),
                    records: {}
                };

                Object.values(localStudents).forEach(s => {
                    updatedScores[s.id] = s.score;
                    auctionSummary.records[s.id] = {
                        id: s.id,
                        name: s.name,
                        initialScore: s.initialScore ?? (s.score + (s.spent || 0)),
                        spent: s.spent || 0,
                        remaining: s.score
                    };
                });

                await fsScoresRef.set(updatedScores, { merge: true });
                await fsAuctionSummaryRef.set(auctionSummary);

                alert('✅ 已成功儲存至 Firestore！\n・主積分表已更新為最新剩餘分數\n・每位學生的「已用分數」與「剩餘分數」亦已同步存檔。');
            } catch (err) {
                console.error(err);
                alert('❌ 寫回 Firestore 失敗：' + err.message);
            }
        }

        // ==========================================
        // 3. 強制登出學生控制（解決學生選錯學號）
        // ==========================================
        function forceLogoutStudent(id) {
            const stuName = rawStudents[id - 1] || '';
            if (!confirm(`確定要強制登出【${id}號 ${stuName}】嗎？\n該學生的裝置將會立即返回「選擇學號」畫面。`)) return;
            sessionsRef.child(id).remove();
        }

        function forceLogoutAll() {
            if (!confirm('⚠️ 確定要強制登出「全班所有學生」嗎？\n所有學生裝置都會退回選擇學號頁面。')) return;
            sessionsRef.remove();
        }

        // ==========================================
        // 4. 獎品庫管理：新增、選擇、隨機抽取
        // ==========================================
        function addPrizeToCatalog() {
            const nameInput = document.getElementById('new-prize-name');
            const baseInput = document.getElementById('new-prize-base');
            const name = nameInput.value.trim();
            const basePrice = Math.max(0, parseInt(baseInput.value) || 0);

            if (!name) {
                alert('⚠️ 請輸入獎品名稱！');
                return;
            }

            const newRef = prizesRef.push();
            newRef.set({
                id: newRef.key,
                name: name,
                basePrice: basePrice,
                sold: false,
                winnerName: '',
                finalPrice: 0,
                createdAt: Date.now()
            });

            nameInput.value = '';
        }

        function addSamplePrizes() {
            const samples = [
                { name: '免做功課券 (一次)', basePrice: 15 },
                { name: '自選座位卡 (一星期)', basePrice: 10 },
                { name: '老師神秘小禮物', basePrice: 5 },
                { name: '小息特別通行證', basePrice: 8 },
                { name: '精美文具套裝', basePrice: 6 }
            ];
            samples.forEach((item, idx) => {
                const newRef = prizesRef.push();
                newRef.set({
                    id: newRef.key,
                    name: item.name,
                    basePrice: item.basePrice,
                    sold: false,
                    winnerName: '',
                    finalPrice: 0,
                    createdAt: Date.now() + idx
                });
            });
        }

        function deletePrize(prizeId) {
            if (currentState && currentState.prizeId === prizeId && (currentState.status === 'BIDDING' || currentState.status === 'TEST_BIDDING')) {
                alert('⚠️ 此獎品正在拍賣中，無法刪除！');
                return;
            }
            prizesRef.child(prizeId).remove();
        }

        function selectPrizeForAuction(prizeId) {
            const prize = localPrizes[prizeId];
            if (!prize) return;
            if (prize.sold) {
                alert('⚠️ 此獎品已成交，無法再次選取！');
                return;
            }
            if (currentState && (currentState.status === 'BIDDING' || currentState.status === 'TEST_BIDDING')) {
                if (!confirm('目前有拍賣正在進行中，確定要切換為此獎品並重設出價嗎？')) return;
            }

            historyRef.remove();
            stateRef.set({
                status: 'IDLE',
                isTest: false,
                prizeId: prize.id,
                prizeName: prize.name,
                basePrice: prize.basePrice,
                currentPrice: prize.basePrice,
                highestBidderId: null,
                highestBidderName: '尚無人出價',
                cooldownUntil: 0
            });
        }

        function randomSelectPrize() {
            if (isRollingPrize) return;
            const availablePrizes = Object.values(localPrizes).filter(p => !p.sold);
            if (availablePrizes.length === 0) {
                alert('⚠️ 沒有可供抽取的未成交獎品！請先新增獎品。');
                return;
            }
            if (currentState && (currentState.status === 'BIDDING' || currentState.status === 'TEST_BIDDING')) {
                if (!confirm('目前有拍賣正在進行中，確定要重新隨機抽取獎品嗎？')) return;
            }

            if (availablePrizes.length === 1) {
                selectPrizeForAuction(availablePrizes[0].id);
                playWinSound();
                return;
            }

            isRollingPrize = true;
            document.getElementById('btn-random-prize').disabled = true;

            let count = 0;
            const maxRolls = 20;
            const interval = setInterval(() => {
                document.querySelectorAll('.prize-item').forEach(el => el.classList.remove('rolling-highlight'));
                const randPrize = availablePrizes[Math.floor(Math.random() * availablePrizes.length)];
                const el = document.getElementById(`prize-row-${randPrize.id}`);
                if (el) {
                    el.classList.add('rolling-highlight');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                playBeep(500 + count * 25, 0.05);
                count++;

                if (count >= maxRolls) {
                    clearInterval(interval);
                    document.querySelectorAll('.prize-item').forEach(el => el.classList.remove('rolling-highlight'));
                    isRollingPrize = false;
                    document.getElementById('btn-random-prize').disabled = false;
                    selectPrizeForAuction(randPrize.id);
                    playBeep(1100, 0.35);
                }
            }, 85);
        }

        // ==========================================
        // 5. 拍賣流程控制
        // ==========================================
        function startAuction(isTestMode) {
            if (Object.keys(localStudents).length === 0) {
                alert('⚠️ 請先按右上角「從 Firestore 載入分數」！');
                return;
            }
            if (!currentState || !currentState.prizeId || !localPrizes[currentState.prizeId]) {
                alert('⚠️ 請先從左側獎品庫「選擇」或「隨機抽取」一份獎品！');
                return;
            }
            const prize = localPrizes[currentState.prizeId];
            if (prize.sold && !isTestMode) {
                alert('⚠️ 此獎品已成交，請選擇其他未成交的獎品！');
                return;
            }

            historyRef.remove();
            stateRef.set({
                status: isTestMode ? 'TEST_BIDDING' : 'BIDDING',
                isTest: isTestMode,
                prizeId: prize.id,
                prizeName: isTestMode ? `【測試】${prize.name}` : prize.name,
                basePrice: prize.basePrice,
                currentPrice: prize.basePrice,
                highestBidderId: null,
                highestBidderName: '尚無人出價',
                cooldownUntil: 0
            });
        }

        async function finalizeDeal() {
            if (!currentState) return;
            if (!currentState.highestBidderId) {
                alert('⚠️ 目前尚無人出價，無法成交！');
                return;
            }

            const now = Date.now() + serverTimeOffset;
            if (now < currentState.cooldownUntil) {
                alert('⏳ 還在 3 秒冷靜期內，請等倒數結束後再按成交！');
                return;
            }

            const winnerId = currentState.highestBidderId;
            const winnerName = currentState.highestBidderName;
            const finalPrice = currentState.currentPrice;
            const isTest = currentState.isTest;
            const prizeId = currentState.prizeId;

            if (isTest) {
                await stateRef.update({
                    status: 'SOLD',
                    cooldownUntil: 0
                });
                fireConfetti();
                playWinSound();
                alert(`🧪 測試拍賣結束！\n得標者：${winnerId}號 ${winnerName}（出價 ${finalPrice} 分）\n※ 測試模式不會扣除分數，亦不會將獎品標記為已成交。`);
            } else {
                if (!confirm(`🔨 確定以【${finalPrice} 分】成交給【${winnerId}號 ${winnerName}】並扣除分數嗎？`)) return;

                const stuRef = rtdb.ref(`Auction4E/students/${winnerId}`);
                await stuRef.transaction((stu) => {
                    if (!stu) return stu;
                    const oldScore = stu.score || 0;
                    const oldSpent = stu.spent || 0;
                    const actualDeduct = Math.min(oldScore, finalPrice);
                    stu.score = oldScore - actualDeduct;
                    stu.spent = oldSpent + actualDeduct;
                    return stu;
                });

                if (prizeId) {
                    await prizesRef.child(prizeId).update({
                        sold: true,
                        winnerId: winnerId,
                        winnerName: `${winnerId}號 ${winnerName}`,
                        finalPrice: finalPrice
                    });
                }

                await stateRef.update({
                    status: 'SOLD',
                    cooldownUntil: 0
                });

                fireConfetti();
                playWinSound();
            }
        }

        function resetCurrentRound() {
            if (!confirm('確定要重置本輪拍賣嗎？（出價將清空，不會扣分）')) return;
            if (currentState && currentState.prizeId && localPrizes[currentState.prizeId]) {
                selectPrizeForAuction(currentState.prizeId);
            } else {
                historyRef.remove();
                stateRef.set({
                    status: 'IDLE',
                    isTest: false,
                    prizeId: null,
                    prizeName: '請選擇或隨機抽取獎品',
                    basePrice: 0,
                    currentPrice: 0,
                    highestBidderId: null,
                    highestBidderName: '尚無人出價',
                    cooldownUntil: 0
                });
            }
        }

        // ==========================================
        // 6. 即時監聽與畫面渲染
        // ==========================================
        let prevPrice = -1;

        stateRef.on('value', (snap) => {
            const data = snap.val();
            currentState = data;

            if (!data) {
                document.getElementById('status-badge').className = 'status-badge status-idle';
                document.getElementById('status-badge').textContent = '⏸ 未開始第一輪拍賣';
                renderPrizeCatalog();
                return;
            }

            if (prevPrice !== -1 && data.currentPrice > prevPrice && data.highestBidderId) {
                playBidSound();
                triggerBidAnimation();
            }
            prevPrice = data.currentPrice;

            const badge = document.getElementById('status-badge');
            const btnDeal = document.getElementById('btn-deal');

            if (data.status === 'IDLE') {
                badge.className = 'status-badge status-idle';
                badge.textContent = '⏸ 準備就緒 / 未開始拍賣';
                btnDeal.disabled = true;
            } else if (data.status === 'BIDDING') {
                badge.className = 'status-badge status-bidding';
                badge.textContent = '🔥 正式拍賣進行中！';
                btnDeal.disabled = !data.highestBidderId;
            } else if (data.status === 'TEST_BIDDING') {
                badge.className = 'status-badge status-test';
                badge.textContent = '🧪 拍賣測試進行中 (不扣分)';
                btnDeal.disabled = !data.highestBidderId;
            } else if (data.status === 'SOLD') {
                badge.className = 'status-badge status-sold';
                badge.textContent = data.isTest ? '✅ 測試成交 (未扣分)' : '🎉 正式成交！已扣分';
                btnDeal.disabled = true;
            }

            document.getElementById('display-prize-name').textContent = data.prizeName;
            document.getElementById('display-base-price').textContent = `底價：${data.basePrice ?? 0} 分`;
            document.getElementById('display-price').innerHTML = `${data.currentPrice} <span>分</span>`;

            const bidderEl = document.getElementById('display-bidder');
            if (data.highestBidderId) {
                bidderEl.textContent = `👑 最高出價：${data.highestBidderId}號 ${data.highestBidderName}`;
                bidderEl.style.color = '#fde047';
            } else {
                bidderEl.textContent = '尚無人出價';
                bidderEl.style.color = '#94a3b8';
            }

            renderPrizeCatalog();
            renderStudentsGrid();
        });

        function triggerBidAnimation() {
            const stage = document.getElementById('auction-stage-box');
            const price = document.getElementById('display-price');
            stage.classList.remove('bid-flash');
            price.classList.remove('pop');
            void stage.offsetWidth;
            stage.classList.add('bid-flash');
            price.classList.add('pop');
        }

        prizesRef.on('value', (snap) => {
            localPrizes = snap.val() || {};
            renderPrizeCatalog();
        });

        studentsRef.on('value', (snap) => {
            localStudents = snap.val() || {};
            renderStudentsGrid();
        });

        sessionsRef.on('value', (snap) => {
            localSessions = snap.val() || {};
            renderStudentsGrid();
        });

        historyRef.limitToLast(15).on('value', (snap) => {
            const listEl = document.getElementById('history-list');
            const val = snap.val();
            if (!val) {
                listEl.innerHTML = '<div style="color: #64748b; font-size: 0.9rem;">暫無出價紀錄</div>';
                return;
            }
            const items = Object.values(val).reverse();
            listEl.innerHTML = items.map(item => `
                <div class="history-item">
                    <span><strong>${item.studentId}號 ${item.studentName}</strong></span>
                    <span style="color: #fde047; font-weight: bold;">出價 ${item.price} 分</span>
                </div>
            `).join('');
        });

        function renderPrizeCatalog() {
            const container = document.getElementById('prize-catalog-list');
            const list = Object.values(localPrizes).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#64748b; padding: 24px;">請在上方輸入獎品名稱與底價</div>';
                return;
            }

            const activeId = currentState ? currentState.prizeId : null;

            container.innerHTML = list.map(p => {
                const isSelected = p.id === activeId;
                const soldLabel = p.sold ? ' (已成交)' : '';
                const metaText = p.sold
                    ? `✅ 得標：${p.winnerName} (${p.finalPrice}分)`
                    : `底價：${p.basePrice} 分`;

                return `
                    <div id="prize-row-${p.id}" class="prize-item ${p.sold ? 'sold-prize' : ''} ${isSelected && !p.sold ? 'active-prize' : ''}">
                        <div class="prize-item-info">
                            <div class="prize-item-title">${p.name}${soldLabel}</div>
                            <div class="prize-item-meta">${metaText}</div>
                        </div>
                        <div class="prize-item-actions">
                            <button class="btn btn-blue btn-sm" onclick="selectPrizeForAuction('${p.id}')" ${p.sold ? 'disabled' : ''}>
                                ${p.sold ? '已成交' : (isSelected ? '已選中' : '選擇')}
                            </button>
                            <button class="btn btn-red btn-sm" onclick="deletePrize('${p.id}')" title="刪除">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderStudentsGrid() {
            const grid = document.getElementById('students-grid');
            const leaderId = currentState ? currentState.highestBidderId : null;

            // 計算在線人數
            let onlineCount = 0;
            rawStudents.forEach((_, idx) => {
                const id = idx + 1;
                if (localSessions[id] && localSessions[id].online) onlineCount++;
            });
            document.getElementById('online-count-badge').textContent = `在線：${onlineCount} / ${rawStudents.length}`;

            const list = Object.values(localStudents).sort((a, b) => a.id - b.id);
            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 30px; color:#94a3b8;">請先點擊上方「從 Firestore 載入分數」</div>';
                return;
            }

            grid.innerHTML = list.map(s => {
                const isOnline = !!(localSessions[s.id] && localSessions[s.id].online);
                return `
                    <div class="stu-chip ${s.id === leaderId ? 'leader' : ''} ${isOnline ? 'is-online' : ''}">
                        <div>
                            <div class="stu-top-row">
                                <span class="id">${s.id}號</span>
                                <span class="login-tag ${isOnline ? 'on' : 'off'}">${isOnline ? '🟢 在線' : '⚪ 離線'}</span>
                            </div>
                            <div class="name">${s.name}</div>
                            <div class="pts">餘 ${s.score} 分</div>
                            <div class="spent">已用 ${s.spent || 0} 分</div>
                        </div>
                        ${isOnline ? `<button class="kick-btn" onclick="forceLogoutStudent(${s.id})">⏏ 強制登出</button>` : ''}
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 7. 3秒冷靜倒數與音效特效
        // ==========================================
        setInterval(() => {
            const banner = document.getElementById('cooldown-banner');
            const secEl = document.getElementById('cooldown-sec');

            if (!currentState || (currentState.status !== 'BIDDING' && currentState.status !== 'TEST_BIDDING')) {
                banner.classList.remove('active');
                return;
            }

            const now = Date.now() + serverTimeOffset;
            const remaining = currentState.cooldownUntil - now;

            if (remaining > 0) {
                banner.classList.add('active');
                secEl.textContent = (remaining / 1000).toFixed(1);
            } else {
                banner.classList.remove('active');
            }
        }, 100);

        function playBeep(freq = 600, dur = 0.08) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + dur);
            } catch (e) {}
        }

        function playBidSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.1);
                    osc.stop(ctx.currentTime + i * 0.1 + 0.4);
                });
            } catch (e) {}
        }

        function fireConfetti() {
            confetti({ particleCount: 110, spread: 85, origin: { y: 0.6 }, zIndex: 9999 });
        }
    </script>
