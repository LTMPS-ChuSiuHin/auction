<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4E 課堂積分拍賣會 - 學生端</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --accent: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; }

        body {
            background: linear-gradient(-45deg, #c7d2fe, #fbcfe8, #bae6fd, #ddd6fe);
            background-size: 400% 400%;
            animation: studentBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            color: #1e293b;
        }

        @keyframes studentBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 22px;
            box-shadow: 0 25px 50px rgba(49, 46, 129, 0.16), inset 0 0 0 1px rgba(255, 255, 255, 0.85);
            margin: auto;
            position: relative;
            overflow: hidden;
        }

        /* 登入畫面 */
        .login-header { text-align: center; margin-bottom: 18px; }
        .login-header h1 {
            font-size: 1.75rem;
            background: linear-gradient(135deg, #312e81, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        .login-header p { color: #64748b; font-size: 0.92rem; margin-top: 6px; font-weight: bold; }

        .student-select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 64vh;
            overflow-y: auto;
            padding: 4px;
        }

        .select-btn {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .select-btn:hover:not(:disabled) {
            background: #eef2ff;
            border-color: #6366f1;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.18);
        }
        .select-btn:active:not(:disabled) { transform: scale(0.95); }

        .select-btn.occupied {
            background: #f1f5f9;
            border-color: #cbd5e1;
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }
        .select-btn .num { font-size: 0.8rem; color: #6366f1; font-weight: 800; }
        .select-btn.occupied .num { color: #94a3b8; }
        .select-btn .name { font-size: 1.05rem; font-weight: 900; color: #1e293b; margin-top: 2px; }
        .select-btn.occupied .name { color: #64748b; }
        .select-btn .lock-badge {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.72rem;
            font-weight: 800;
            color: #ef4444;
            background: #fee2e2;
            padding: 1px 7px;
            border-radius: 99px;
        }

        /* 拍賣主畫面 (已移除切換學號按鈕) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            border: 1px solid #c7d2fe;
            padding: 12px 16px;
            border-radius: 18px;
            margin-bottom: 14px;
        }
        .my-info .name { font-weight: 900; font-size: 1.15rem; color: #312e81; }
        .my-info .score-row { display: flex; gap: 12px; align-items: baseline; margin-top: 3px; }
        .my-info .score { font-weight: 900; font-size: 1.25rem; color: #059669; }
        .my-info .spent { font-weight: 800; font-size: 0.88rem; color: #d97706; }

        .locked-identity-tag {
            font-size: 0.78rem;
            font-weight: 800;
            color: #4f46e5;
            background: rgba(255, 255, 255, 0.85);
            padding: 5px 10px;
            border-radius: 10px;
            border: 1px solid #c7d2fe;
        }

        .status-pill {
            text-align: center;
            padding: 9px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 0.94rem;
            margin-bottom: 12px;
        }
        .pill-idle { background: #e2e8f0; color: #475569; }
        .pill-bidding { background: #dcfce7; color: #15803d; border: 1px solid #86efac; animation: softPulse 1.6s infinite; }
        .pill-test { background: #f3e8ff; color: #7e22ce; border: 1px solid #d8b4fe; }
        .pill-sold { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

        @keyframes softPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }

        .prize-card {
            background: radial-gradient(circle at top right, #312e81, #1e1b4b 75%);
            color: white;
            border-radius: 24px;
            padding: 22px 16px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 15px 30px rgba(49, 46, 129, 0.28);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .prize-card.leading-glow {
            box-shadow: 0 0 0 3px #10b981, 0 15px 35px rgba(16, 185, 129, 0.45);
        }
        .prize-card .label { font-size: 0.88rem; color: #a5b4fc; font-weight: bold; }
        .prize-card .title { font-size: 1.45rem; font-weight: 900; margin: 4px 0 10px; color: #fff; }
        .prize-card .price {
            font-size: 3.6rem;
            font-weight: 900;
            color: #fde047;
            line-height: 1;
            text-shadow: 0 0 25px rgba(253, 224, 71, 0.45);
        }
        .prize-card .price span { font-size: 1.15rem; }
        .prize-card .leader {
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.98rem;
            font-weight: 800;
            color: #7dd3fc;
        }
        .prize-card .leader.is-me {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.38), rgba(5, 150, 105, 0.25));
            color: #6ee7b7;
            border: 1px solid #34d399;
        }

        /* 飄浮出價特效字 */
        .float-bid-fx {
            position: fixed;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.4rem;
            font-weight: 900;
            color: #f59e0b;
            text-shadow: 0 4px 15px rgba(0,0,0,0.25), 0 0 12px #fff;
            pointer-events: none;
            z-index: 9999;
            animation: floatSuccess 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes floatSuccess {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
            30% { opacity: 1; transform: translate(-50%, -20px) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
        }

        .cooldown-overlay {
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #b91c1c;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 1.1rem;
            margin-bottom: 14px;
            display: none;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.18);
        }
        .cooldown-overlay.active { display: block; }

        .bid-section-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: #475569;
            margin-bottom: 8px;
            text-align: center;
        }

        .quick-bids {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-bottom: 12px;
        }

        .bid-btn {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 6px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.28);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bid-btn small { font-size: 0.74rem; font-weight: normal; opacity: 0.88; margin-top: 2px; }
        .bid-btn:active:not(:disabled) { transform: scale(0.93); }
        .bid-btn:disabled {
            background: #cbd5e1;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .custom-bid-box {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .custom-bid-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 900;
            text-align: center;
            outline: none;
            min-width: 0;
        }
        .custom-bid-box input:focus { border-color: #4f46e5; box-shadow: 0 0 12px rgba(79, 70, 229, 0.2); }
        .custom-bid-box button {
            padding: 0 20px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .custom-bid-box button:disabled { background: #cbd5e1; color: #94a3b8; box-shadow: none; cursor: not-allowed; }

        .feedback-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 0.92rem;
            font-weight: 800;
            min-height: 20px;
            color: #ef4444;
        }

        /* 學生預覽全場獎品目錄 */
        .catalog-box {
            margin-top: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 14px;
        }
        .catalog-header {
            font-size: 0.98rem;
            font-weight: 900;
            color: #312e81;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .catalog-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }
        .catalog-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 9px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .catalog-item.current {
            border: 2px solid #6366f1;
            background: #eef2ff;
        }
        .catalog-item.sold {
            opacity: 0.6;
            background: #f1f5f9;
        }
        .catalog-item .c-name {
            font-weight: 900;
            font-size: 0.95rem;
            color: #1e293b;
        }
        .catalog-item.sold .c-name {
            text-decoration: line-through;
            color: #64748b;
        }
        .catalog-item .c-badge {
            font-size: 0.8rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 99px;
            white-space: nowrap;
        }
        .badge-wait { background: #fef3c7; color: #b45309; }
        .badge-now { background: #dcfce7; color: #15803d; }
        .badge-sold { background: #e2e8f0; color: #475569; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 畫面 1：選擇學號登入 -->
        <div id="login-view">
            <div class="login-header">
                <h1>🔨 4E 積分拍賣會</h1>
                <p>請點選你的學號登入（每人限用一部裝置）</p>
            </div>
            <div class="student-select-grid" id="student-select-grid"></div>
        </div>

        <!-- 畫面 2：拍賣競標操作 (已刪除切換學號按鈕) -->
        <div id="auction-view" style="display: none;">
            <div class="top-bar">
                <div class="my-info">
                    <div class="name" id="my-name-display">--</div>
                    <div class="score-row">
                        <span class="score">剩餘：<span id="my-score-display">0</span> 分</span>
                        <span class="spent">(已用：<span id="my-spent-display">0</span> 分)</span>
                    </div>
                </div>
                <span class="locked-identity-tag">🔒 已綁定本機</span>
            </div>

            <div id="status-pill" class="status-pill pill-idle">⏸ 等待老師開始拍賣...</div>

            <div class="prize-card" id="prize-card-box">
                <div class="label">當前拍賣獎品</div>
                <div class="title" id="prize-title">尚未開始</div>
                <div class="price" id="current-price">0 <span>分</span></div>
                <div class="leader" id="highest-bidder">尚無人出價</div>
            </div>

            <!-- 3秒冷靜期提示 -->
            <div class="cooldown-overlay" id="cooldown-box">
                ⏳ 剛剛有人出價！冷靜 <span id="cooldown-timer">3.0</span> 秒...
            </div>

            <div class="bid-section-title">選擇加碼分數（出價必須高於現價）</div>
            <div class="quick-bids">
                <button class="bid-btn" id="btn-plus-1" onclick="placeQuickBid(1)">+1<small id="lbl-plus-1"></small></button>
                <button class="bid-btn" id="btn-plus-2" onclick="placeQuickBid(2)">+2<small id="lbl-plus-2"></small></button>
                <button class="bid-btn" id="btn-plus-3" onclick="placeQuickBid(3)">+3<small id="lbl-plus-3"></small></button>
                <button class="bid-btn" id="btn-plus-5" onclick="placeQuickBid(5)">+5<small id="lbl-plus-5"></small></button>
                <button class="bid-btn" id="btn-plus-10" onclick="placeQuickBid(10)">+10<small id="lbl-plus-10"></small></button>
            </div>

            <div class="custom-bid-box">
                <input type="number" id="custom-bid-input" placeholder="輸入自訂總價" min="1">
                <button id="btn-custom-bid" onclick="placeCustomBid()">自訂出價</button>
            </div>

            <div class="feedback-msg" id="feedback-msg"></div>

            <!-- 全場獎品與底價預覽 -->
            <div class="catalog-box">
                <div class="catalog-header">
                    <span>🎁 全場拍賣獎品一覽</span>
                    <span style="font-size:0.8rem; color:#64748b;" id="catalog-count">0 項</span>
                </div>
                <div class="catalog-list" id="student-prize-list">
                    <div style="text-align:center; color:#94a3b8; font-size:0.9rem; padding:10px;">老師尚未公布獎品清單</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. Firebase 初始化 (指定 Asia-Southeast1 RTDB)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBr0-oNmRN859g6bfGDVjSdA1brJC8CxNs",
            authDomain: "ltmps-c92a0.firebaseapp.com",
            databaseURL: "https://ltmps-c92a0-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ltmps-c92a0",
            storageBucket: "ltmps-c92a0.firebasestorage.app",
            messagingSenderId: "716255242034",
            appId: "1:716255242034:web:b25a037869d8a9de6f992b"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();
        const stateRef = rtdb.ref('Auction4E/state');
        const sessionsRef = rtdb.ref('Auction4E/sessions');
        const prizesRef = rtdb.ref('Auction4E/prizes');
        const historyRef = rtdb.ref('Auction4E/history');

        const rawStudents = [
            "陳卓謙", "陳賀楠", "陳子正", "陳奕謙", "陳禹衡",
            "鄭斯豪", "招卓康", "莊榳昊", "丁安妮", "馮溢匡",
            "郭慧瑤", "許悅", "關海泠", "關海瑤", "郭思翹",
            "黎晞彤", "李海琳", "梁靖童", "梁頌朗", "梁僖悅",
            "梁梓童", "李詠晴", "文樂兒", "吳梓謙", "吳泳汶",
            "彭瀚程", "譚健希", "譚文昊", "曾立言", "謝思睿",
            "黃芊林", "俞逸澧"
        ];

        // 為本瀏覽器分頁產生唯一裝置識別碼，防重複登入
        let deviceSessionToken = sessionStorage.getItem('auction_4e_device_token');
        if (!deviceSessionToken) {
            deviceSessionToken = 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            sessionStorage.setItem('auction_4e_device_token', deviceSessionToken);
        }

        let myStudentId = null;
        let myStudentName = '';
        let myCurrentScore = 0;
        let mySpentScore = 0;
        let auctionState = null;
        let allPrizes = {};
        let activeSessions = {};
        let serverTimeOffset = 0;
        let myStudentListener = null;
        let mySessionGuardListener = null;

        rtdb.ref('.info/serverTimeOffset').on('value', (snap) => {
            serverTimeOffset = snap.val() || 0;
        });

        // 監聽全班登入佔用狀態，即時更新登入按鈕鎖定
        sessionsRef.on('value', (snap) => {
            activeSessions = snap.val() || {};
            if (!myStudentId) {
                renderLoginGrid();
            }
        });

        // ==========================================
        // 2. 防重複登入與老師強制登出監聽
        // ==========================================
        function renderLoginGrid() {
            const grid = document.getElementById('student-select-grid');
            grid.innerHTML = rawStudents.map((name, idx) => {
                const id = idx + 1;
                const sess = activeSessions[id];
                const isOccupiedByOther = sess && sess.online && sess.token !== deviceSessionToken;

                if (isOccupiedByOther) {
                    return `
                        <button class="select-btn occupied" disabled>
                            <div class="num">${id}號</div>
                            <div class="name">${name}</div>
                            <div class="lock-badge">🔒 已登入</div>
                        </button>
                    `;
                }
                return `
                    <button class="select-btn" onclick="attemptLogin(${id})">
                        <div class="num">${id}號</div>
                        <div class="name">${name}</div>
                    </button>
                `;
            }).join('');
        }

        function attemptLogin(id) {
            const stuSessionRef = sessionsRef.child(id);

            // 使用原子事務搶佔學號鎖，確保兩部裝置同時點擊也不會重複登入
            stuSessionRef.transaction((currentSess) => {
                if (currentSess && currentSess.online && currentSess.token !== deviceSessionToken) {
                    return; // 已被其他裝置搶先登入，中止交易
                }
                return {
                    online: true,
                    token: deviceSessionToken,
                    loginAt: Date.now()
                };
            }, (error, committed) => {
                if (error) {
                    alert('❌ 網路連線異常，請重試！');
                    return;
                }
                if (!committed) {
                    alert(`⚠️ ${id}號 ${rawStudents[id - 1]} 已經在另一部裝置登入了！\n若選錯學號，請舉手請老師在控制台按「強制登出」。`);
                    return;
                }

                // 登入成功，設定斷線自動釋放鎖定
                stuSessionRef.onDisconnect().remove();
                enterAuctionRoom(id);
            });
        }

        function enterAuctionRoom(id) {
            myStudentId = id;
            myStudentName = rawStudents[id - 1];
            sessionStorage.setItem('auction_4e_student_id', id);

            document.getElementById('login-view').style.display = 'none';
            document.getElementById('auction-view').style.display = 'block';
            document.getElementById('my-name-display').textContent = `${id}號 ${myStudentName}`;

            // 監聽老師是否執行「強制登出」或被踢出
            if (mySessionGuardListener) mySessionGuardListener.off();
            mySessionGuardListener = sessionsRef.child(id);
            mySessionGuardListener.on('value', (snap) => {
                const sess = snap.val();
                if (!sess || !sess.online || sess.token !== deviceSessionToken) {
                    // 被老師強制登出，退回選擇學號畫面
                    handleForcedLogout();
                }
            });

            // 監聽該學生的即時積分與已用分數
            if (myStudentListener) myStudentListener.off();
            myStudentListener = rtdb.ref(`Auction4E/students/${id}`);
            myStudentListener.on('value', (snap) => {
                const data = snap.val() || {};
                myCurrentScore = data.score || 0;
                mySpentScore = data.spent || 0;
                document.getElementById('my-score-display').textContent = myCurrentScore;
                document.getElementById('my-spent-display').textContent = mySpentScore;
                updateButtonsState();
            });

            updateButtonsState();
        }

        function handleForcedLogout() {
            if (!myStudentId) return;
            sessionStorage.removeItem('auction_4e_student_id');
            if (myStudentListener) myStudentListener.off();
            if (mySessionGuardListener) mySessionGuardListener.off();
            myStudentId = null;

            document.getElementById('auction-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'block';
            renderLoginGrid();
            alert('📢 老師已將你登出，請重新選擇正確的學號！');
        }

        // ==========================================
        // 3. 監聽拍賣狀態與獎品清單
        // ==========================================
        let prevWinnerId = null;
        let prevStatus = null;

        stateRef.on('value', (snap) => {
            auctionState = snap.val();

            // 若正式成交且得標者是自己，放彩帶慶祝
            if (auctionState && auctionState.status === 'SOLD' && prevStatus !== 'SOLD' && auctionState.highestBidderId === myStudentId) {
                confetti({ particleCount: 90, spread: 75, origin: { y: 0.6 }, zIndex: 9999 });
            }
            prevStatus = auctionState ? auctionState.status : null;
            prevWinnerId = auctionState ? auctionState.highestBidderId : null;

            renderAuctionState();
            renderPrizeCatalog();
            updateButtonsState();
        });

        prizesRef.on('value', (snap) => {
            allPrizes = snap.val() || {};
            renderPrizeCatalog();
        });

        function renderPrizeCatalog() {
            const listEl = document.getElementById('student-prize-list');
            const countEl = document.getElementById('catalog-count');
            const list = Object.values(allPrizes).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

            countEl.textContent = `共 ${list.length} 項`;

            if (list.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#94a3b8; font-size:0.9rem; padding:10px;">老師尚未公布獎品清單</div>';
                return;
            }

            const activeId = auctionState ? auctionState.prizeId : null;

            listEl.innerHTML = list.map(p => {
                const isCurrent = p.id === activeId && !p.sold;
                let badgeHtml = `<span class="c-badge badge-wait">底價 ${p.basePrice} 分</span>`;
                if (p.sold) {
                    badgeHtml = `<span class="c-badge badge-sold">已成交 (${p.finalPrice}分)</span>`;
                } else if (isCurrent) {
                    badgeHtml = `<span class="c-badge badge-now">🔥 拍賣中 (底價${p.basePrice}分)</span>`;
                }

                return `
                    <div class="catalog-item ${p.sold ? 'sold' : ''} ${isCurrent ? 'current' : ''}">
                        <span class="c-name">${p.name}${p.sold ? ' (已成交)' : ''}</span>
                        ${badgeHtml}
                    </div>
                `;
            }).join('');
        }

        function renderAuctionState() {
            const pill = document.getElementById('status-pill');
            const titleEl = document.getElementById('prize-title');
            const priceEl = document.getElementById('current-price');
            const bidderEl = document.getElementById('highest-bidder');
            const prizeCard = document.getElementById('prize-card-box');

            if (!auctionState || auctionState.status === 'IDLE') {
                pill.className = 'status-pill pill-idle';
                pill.textContent = '⏸ 未開始拍賣，請留意老師指示';
                titleEl.textContent = auctionState ? auctionState.prizeName : '等待老師準備獎品...';
                priceEl.innerHTML = `${auctionState ? auctionState.currentPrice : 0} <span>分</span>`;
                bidderEl.className = 'leader';
                bidderEl.textContent = '尚無人出價';
                prizeCard.classList.remove('leading-glow');
                return;
            }

            if (auctionState.status === 'BIDDING') {
                pill.className = 'status-pill pill-bidding';
                pill.textContent = '🔥 正式拍賣中！請出價';
            } else if (auctionState.status === 'TEST_BIDDING') {
                pill.className = 'status-pill pill-test';
                pill.textContent = '🧪 測試拍賣中（不會扣分）';
            } else if (auctionState.status === 'SOLD') {
                pill.className = 'status-pill pill-sold';
                pill.textContent = auctionState.isTest ? '✅ 測試成交！' : '🎉 恭喜成交！';
            }

            titleEl.textContent = auctionState.prizeName;
            priceEl.innerHTML = `${auctionState.currentPrice} <span>分</span>`;

            if (auctionState.highestBidderId) {
                if (auctionState.highestBidderId === myStudentId) {
                    bidderEl.className = 'leader is-me';
                    bidderEl.textContent = `👑 目前由你領先！(${auctionState.highestBidderName})`;
                    prizeCard.classList.add('leading-glow');
                } else {
                    bidderEl.className = 'leader';
                    bidderEl.textContent = `👑 最高出價：${auctionState.highestBidderId}號 ${auctionState.highestBidderName}`;
                    prizeCard.classList.remove('leading-glow');
                }
            } else {
                bidderEl.className = 'leader';
                bidderEl.textContent = '尚無人出價';
                prizeCard.classList.remove('leading-glow');
            }
        }

        function updateButtonsState() {
            const increments = [1, 2, 3, 5, 10];
            const isBiddingActive = auctionState && (auctionState.status === 'BIDDING' || auctionState.status === 'TEST_BIDDING');
            const now = Date.now() + serverTimeOffset;
            const inCooldown = auctionState && (now < auctionState.cooldownUntil);
            const currentPrice = auctionState ? auctionState.currentPrice : 0;

            increments.forEach(inc => {
                const btn = document.getElementById(`btn-plus-${inc}`);
                const lbl = document.getElementById(`lbl-plus-${inc}`);
                const targetPrice = currentPrice + inc;
                lbl.textContent = `(${targetPrice}分)`;

                if (!isBiddingActive || inCooldown || targetPrice > myCurrentScore) {
                    btn.disabled = true;
                } else {
                    btn.disabled = false;
                }
            });

            const customBtn = document.getElementById('btn-custom-bid');
            const customInput = document.getElementById('custom-bid-input');
            if (!isBiddingActive || inCooldown || myCurrentScore <= currentPrice) {
                customBtn.disabled = true;
                customInput.disabled = true;
            } else {
                customBtn.disabled = false;
                customInput.disabled = false;
                customInput.min = currentPrice + 1;
                customInput.max = myCurrentScore;
                customInput.placeholder = `輸入 ${currentPrice + 1} ~ ${myCurrentScore}`;
            }
        }

        setInterval(() => {
            if (!myStudentId) return;
            const box = document.getElementById('cooldown-box');
            const timerEl = document.getElementById('cooldown-timer');

            if (!auctionState || (auctionState.status !== 'BIDDING' && auctionState.status !== 'TEST_BIDDING')) {
                box.classList.remove('active');
                updateButtonsState();
                return;
            }

            const now = Date.now() + serverTimeOffset;
            const remaining = auctionState.cooldownUntil - now;

            if (remaining > 0) {
                box.classList.add('active');
                timerEl.textContent = (remaining / 1000).toFixed(1);
            } else {
                box.classList.remove('active');
            }
            updateButtonsState();
        }, 100);

        // ==========================================
        // 4. 提交出價與視覺特效
        // ==========================================
        function placeQuickBid(increment) {
            if (!auctionState) return;
            submitBid(auctionState.currentPrice + increment);
        }

        function placeCustomBid() {
            const input = document.getElementById('custom-bid-input');
            const val = parseInt(input.value);
            if (isNaN(val)) {
                showFeedback('⚠️ 請輸入有效的數字！');
                return;
            }
            submitBid(val);
            input.value = '';
        }

        function submitBid(bidAmount) {
            showFeedback('');

            if (!myStudentId || !auctionState) return;
            if (auctionState.status !== 'BIDDING' && auctionState.status !== 'TEST_BIDDING') {
                showFeedback('⚠️ 目前並非拍賣進行時間！');
                return;
            }
            if (bidAmount <= auctionState.currentPrice) {
                showFeedback(`⚠️ 出價必須高於現價 (${auctionState.currentPrice} 分)！`);
                return;
            }
            if (bidAmount > myCurrentScore) {
                showFeedback(`⚠️ 你的分數不足！你目前剩餘 ${myCurrentScore} 分。`);
                return;
            }

            const now = Date.now() + serverTimeOffset;
            if (now < auctionState.cooldownUntil) {
                showFeedback('⏳ 還在 3 秒冷靜期內，請稍候！');
                return;
            }

            stateRef.transaction((currentData) => {
                if (!currentData) return currentData;
                if (currentData.status !== 'BIDDING' && currentData.status !== 'TEST_BIDDING') return;
                if (bidAmount <= currentData.currentPrice) return;
                const serverNow = Date.now() + serverTimeOffset;
                if (serverNow < currentData.cooldownUntil) return;

                currentData.currentPrice = bidAmount;
                currentData.highestBidderId = myStudentId;
                currentData.highestBidderName = myStudentName;
                currentData.cooldownUntil = serverNow + 3000;
                return currentData;
            }, (error, committed) => {
                if (error) {
                    showFeedback('❌ 網路連線錯誤，請重試。');
                } else if (!committed) {
                    showFeedback('⚡ 手慢了一步！已有同學搶先出價或進入冷靜期。');
                } else {
                    historyRef.push({
                        studentId: myStudentId,
                        studentName: myStudentName,
                        price: bidAmount,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    spawnFloatFx(`👑 出價 ${bidAmount} 分！`);
                    showFeedback('✅ 出價成功！', '#059669');
                }
            });
        }

        function spawnFloatFx(text) {
            const el = document.createElement('div');
            el.className = 'float-bid-fx';
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 950);
        }

        function showFeedback(msg, color = '#ef4444') {
            const el = document.getElementById('feedback-msg');
            el.style.color = color;
            el.textContent = msg;
            if (msg) {
                setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
            }
        }

        // 啟動畫面：若重新整理分頁且同一裝置仍持有鎖，自動恢復登入；否則顯示選擇列表
        renderLoginGrid();
        const savedId = sessionStorage.getItem('auction_4e_student_id');
        if (savedId) {
            attemptLogin(parseInt(savedId));
        }
    </script>
</body>
